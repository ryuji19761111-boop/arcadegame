<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>⚡ VIDEO PiP CONTROLLER v2</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Consolas, "Courier New", monospace;
    max-width: 600px;
    margin: 40px auto;
    padding: 20px;
    background: #0d1117;
    color: #c9d1d9;
    border: 2px solid #58a6ff;
    border-radius: 12px;
}

h1 {
    color: #58a6ff;
    font-size: 20px;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 25px;
}

.system-box {
    background: #161b22;
    padding: 20px;
    border-radius: 8px;
    border: 1px solid #30363d;
}

p {
    font-size: 13px;
    line-height: 1.6;
    color: #8b949e;
    margin-top: 0;
}

.step {
    color: #f0883e;
    font-weight: bold;
}

.cyber-btn {
    background: linear-gradient(135deg,#238636,#2ea043);
    color: white;
    border: none;
    padding: 14px 20px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    width: 100%;
    font-size: 14px;
    letter-spacing: 1px;
    box-shadow: 0 3px 10px rgba(46,160,67,.3);
    transition: .2s;
}

.cyber-btn:hover {
    background: linear-gradient(135deg,#2ea043,#3fb950);
    transform: translateY(-1px);
}

.cyber-btn:active {
    transform: translateY(1px);
}

.cyber-btn:disabled {
    opacity: .5;
    cursor: not-allowed;
    transform: none;
}

video {
    display: none;
    width: 100%;
    margin-top: 20px;
    border-radius: 6px;
    border: 1px solid #30363d;
    background: #000;
}

.status {
    margin-top: 15px;
    font-size: 11px;
    color: #58a6ff;
    min-height: 16px;
}

.status.error {
    color: #f85149;
}

.status.success {
    color: #3fb950;
}

.stop-btn {
    display: none;
    margin-top: 10px;
    background: #21262d;
    border: 1px solid #30363d;
}

.stop-btn:hover {
    background: #30363d;
}
</style>
</head>

<body>

<h1>⚡ VIDEO PiP CONTROLLER v2</h1>

<div class="system-box">

    <p>
        <span class="step">STEP 1:</span>
        YouTubeなどで動画・ライブを再生します。
    </p>

    <p>
        <span class="step">STEP 2:</span>
        下のボタンを押して、共有するChromeタブを選択します。
    </p>

    <p>
        <span class="step">STEP 3:</span>
        映像を取得したらPiPを開始します。
    </p>

    <button class="cyber-btn" id="launch-pip">
        ▶ LAUNCH SPECIAL PiP
    </button>

    <button class="cyber-btn stop-btn" id="stop-share">
        ■ STOP SHARING
    </button>

    <video
        id="pip-monitor"
        autoplay
        playsinline
        muted>
    </video>

    <div class="status" id="status">
        ▲ SYSTEM: READY
    </div>

</div>

<script>
"use strict";

const video = document.getElementById("pip-monitor");
const launchBtn = document.getElementById("launch-pip");
const stopBtn = document.getElementById("stop-share");
const statusEl = document.getElementById("status");

let stream = null;
let videoTrack = null;

function setStatus(text, type = "") {
    statusEl.textContent = "▲ SYSTEM: " + text;
    statusEl.className = "status " + type;
}

function cleanup() {
    if (stream) {
        stream.getTracks().forEach(track => track.stop());
    }

    stream = null;
    videoTrack = null;

    video.pause();
    video.srcObject = null;
    video.style.display = "none";

    launchBtn.disabled = false;
    stopBtn.style.display = "none";

    setStatus("READY");
}

async function startPiP() {

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getDisplayMedia) {

        setStatus(
            "SCREEN CAPTURE IS NOT SUPPORTED",
            "error"
        );

        alert(
            "このブラウザでは画面共有機能が利用できません。"
        );

        return;
    }

    if (!document.pictureInPictureEnabled) {

        setStatus(
            "PICTURE-IN-PICTURE IS NOT SUPPORTED",
            "error"
        );

        alert(
            "このブラウザではPiPが利用できません。"
        );

        return;
    }

    try {

        launchBtn.disabled = true;

        setStatus("OPENING SHARE SELECTOR...");

        stream = await navigator.mediaDevices.getDisplayMedia({
            video: {
                displaySurface: "browser"
            },
            audio: false
        });

        videoTrack = stream.getVideoTracks()[0];

        if (!videoTrack) {
            throw new Error("Video track unavailable");
        }

        video.srcObject = stream;
        video.style.display = "block";

        setStatus("CONNECTING VIDEO...");

        await video.play();

        setStatus("STARTING PICTURE-IN-PICTURE...");

        /*
         * 重要:
         * PiP要求をユーザーのボタン操作から始まった
         * 非同期処理の流れで実行する。
         */
        await video.requestPictureInPicture();

        setStatus(
            "PiP ACTIVE",
            "success"
        );

        stopBtn.style.display = "block";

        /*
         * PiPウィンドウを閉じても共有自体は
         * 継続する場合があるため、ここでは
         * 自動終了させない。
         */

    } catch (error) {

        console.error(error);

        cleanup();

        if (error.name === "NotAllowedError") {

            setStatus(
                "SHARE CANCELLED",
                "error"
            );

        } else if (error.name === "NotSupportedError") {

            setStatus(
                "PiP NOT SUPPORTED",
                "error"
            );

        } else {

            setStatus(
                "FAILED: " + error.name,
                "error"
            );
        }
    }
}

launchBtn.addEventListener("click", startPiP);

stopBtn.addEventListener("click", async () => {

    try {

        if (document.pictureInPictureElement) {
            await document.exitPictureInPicture();
        }

    } catch (e) {
        console.warn(e);
    }

    cleanup();
});

video.addEventListener("leavepictureinpicture", () => {

    /*
     * PiPを閉じただけでは共有を止めない。
     * ユーザーがSTOPを押した場合のみ終了。
     */

    if (stream) {
        setStatus(
            "PiP CLOSED / SHARING STILL ACTIVE",
            "success"
        );
    }
});

video.addEventListener("error", () => {

    setStatus(
        "VIDEO ERROR",
        "error"
    );
});

document.addEventListener("visibilitychange", () => {

    if (!document.hidden && stream) {
        setStatus(
            document.pictureInPictureElement
                ? "PiP ACTIVE"
                : "SHARING ACTIVE",
            "success"
        );
    }
});

window.addEventListener("beforeunload", () => {

    if (stream) {
        stream.getTracks().forEach(track => track.stop());
    }
});

</script>

</body>
</html>
